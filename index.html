<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- # Meta ViewPort sirve para que en dispositivos moviles el tamaño de los contenidos se adapten bien y no se aumente o disminulla al haceer mas grande o pequeña la pantalla. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulario</title>
    <link rel="stylesheet" type="text/css" href="./style.css" />
  </head>
  <body>
    <form action="./mostrarResultado.php" method="get">
      <h1>Formulario Horario</h1>

      <fieldset>
        <label for="asignatura">Asignatura: </label>
        <select name="asignatura" id="asignatura">
          <option value="BBDD">Base de Datos</option>
          <option value="EEDD">Entorno de Desarrollo</option>
          <option value="PROG">Programacion</option>
          <option value="SSINF">Sistemas Informaticos</option>
          <option value="LMSG">Lenguaje de Marcas</option>
          <option value="INGP">Ingles Profesional</option>
          <option value="IPE1">Itinerario Personal para Empleabilidad 1</option>
          <option value="TUTO">Tutoria</option>
        </select>
      </fieldset>

      <fieldset>
        <legend>Profesores:</legend>
        <label for="IMD">
          <input
            type="radio"
            name="profesores[]"
            value="Isabel Muñoz Dominguez"
            id="IMD"
          />Isabel Muñoz Dominguez</label
        >
        <label for="FGR">
          <input
            type="radio"
            name="profesores[]"
            value="Francisco Garcia Ramirez"
            id="FGR"
          />Francisco Garcia Ramirez</label
        >
        <label for="ADL">
          <input
            type="radio"
            name="profesores[]"
            value="Alberto Dominguez Lebrato"
            id="ADL"
          />Alberto Dominguez Lebrato</label
        >
        <label for="SVA">
          <input
            type="radio"
            name="profesores[]"
            value="Santiago Vazquez Aguilar"
            id="SVA"
          />Santiago Vazquez Aguilar</label
        >
        <label for="JMAG">
          <input
            type="radio"
            name="profesores[]"
            value="Jose Maria Auirio Gomez"
            id="JMAG"
          />Jose Maria Auirio Gomez</label
        >
      </fieldset>

      <fieldset>
        <legend>Dia de la semana:</legend>
        <label for="lunes">
          <input type="checkbox" name="semana" value="lunes" id="lunes" />
          Lunes</label
        >
        <label for="martes">
          <input
            type="checkbox"
            name="semana"
            id="martes"
            value="martes"
          />Martes</label
        >
        <label for="miercoles">
          <input
            type="checkbox"
            name="semana"
            id="miercoles"
            value="miercoles"
          />Miercoles</label
        >
        <label for="jueves">
          <input
            type="checkbox"
            name="semana"
            id="jueves"
            value="jueves"
          />Jueves</label
        >
        <label for="viernes">
          <input
            type="checkbox"
            name="semana"
            id="viernes"
            value="viernes"
          />Viernes</label
        >
      </fieldset>

      <fieldset>
        <label for="horas">Horas: </label>
        <input type="text" name="horas" id="horas" />
      </fieldset>

      <fieldset>
        <label for="informacion">Informacion: </label>
        <textarea
          name="informacion"
          id="informacion"
          cols="20"
          rows="10"
        ></textarea>
      </fieldset>

      <input type="submit" value="Enviar" />
    </form>
  </body>
</html>
